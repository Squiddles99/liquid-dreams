    <style>
      /* The loading cover (loading screens spec §1.1): inline so it paints before the game's code loads. */
      @font-face { font-family: 'Knewave'; src: url('/fonts/knewave-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
      @font-face { font-family: 'Caveat Brush'; src: url('/fonts/caveat-brush-400.woff2') format('woff2'); font-weight: 400; font-display: block; }
      @font-face { font-family: 'Barlow Semi Condensed'; src: url('/fonts/barlow-semi-condensed-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
      @font-face { font-family: 'Barlow Semi Condensed'; src: url('/fonts/barlow-semi-condensed-600.woff2') format('woff2'); font-weight: 600; font-display: block; }
      @font-face { font-family: 'Barlow'; src: url('/fonts/barlow-500.woff2') format('woff2'); font-weight: 500; font-display: block; }
      :root { --ld-sand: #e8dbc4; --ld-teal: #3f959b; --ld-orange: #f7931e; --ld-cream: #f7ecd2; --ld-ink: #0a1a1f; }
      html, body { background: var(--ld-sand); }
      .ld-cover { position: fixed; inset: 0; z-index: 2147483000; background: var(--ld-ink); overflow: hidden; pointer-events: none;
        opacity: 1; transition: opacity 400ms ease-out; }
      .ld-cover:not(.is-in) { opacity: 0; }
      .ld-cover.is-out { opacity: 0; transition: opacity 1200ms cubic-bezier(0.33, 1, 0.68, 1); }
      .ld-cover.is-out.is-calm { transition-duration: 300ms; }
      .ld-cover[hidden] { display: none; }
      /* While it blocks the player, the mouse stops here too: no click, wheel or hover reaches the menu under it. */
      .ld-cover.is-blocking { pointer-events: auto; cursor: progress; }
      .ld-cover-bg { position: absolute; inset: 0; opacity: 0; transition: opacity 300ms ease-out; }
      .ld-cover-bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
      /* A dark pool in the bottom-left corner, so the coin and the line read over bright water. */
      .ld-shade { position: absolute; inset: 0; background: radial-gradient(ellipse 47vw 48vh at 0% 100%, rgba(4, 16, 22, 0.72), rgba(4, 16, 22, 0) 70%); }
      .ld-brand { position: absolute; left: 3.3vw; bottom: 5.2vh; display: flex; align-items: center; gap: 2vh; opacity: 0; transition: opacity 300ms ease-out; }
      .ld-cover.is-ready .ld-cover-bg, .ld-cover.is-ready .ld-brand { opacity: 1; }
      /* The coin (Andrew's spinning-logo-loader): two emblem faces on a copper rim of 96 panels, turning every 8 s.
         Pure CSS transform animation, so the compositor keeps it turning while the main thread builds shaders. */
      .ld-coin-scene { --coin: 15.5vh; --thick: calc(var(--coin) * 0.14); --r: calc(var(--coin) * 0.48);
        width: var(--coin); height: var(--coin); flex: none; perspective: 900px; filter: drop-shadow(0 1vh 1.7vh rgba(0, 0, 0, 0.45)); }
      .ld-coin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: ld-spin 8s linear infinite; will-change: transform; }
      .ld-face, .ld-rim { position: absolute; inset: 0; transform-style: preserve-3d; }
      .ld-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: url(/loading/emblem.webp) center / contain no-repeat; }
      .ld-face-front { transform: translateZ(calc(var(--thick) / 2 + 0.2px)); }
      .ld-face-back { transform: rotateY(180deg) translateZ(calc(var(--thick) / 2 + 0.2px)); }
      .ld-rim span { position: absolute; left: 50%; top: 50%; width: var(--thick); height: calc(var(--coin) * 0.032725 + 0.8px);
        margin-left: calc(var(--thick) / -2); margin-top: calc((var(--coin) * 0.032725 + 0.8px) / -2);
        background: linear-gradient(90deg, #6b3b25 0%, #e49b3e 5%, #ffd078 10%, #a65e2b 18%, #784326 43%, #8b4c27 57%, #bb702e 82%, #ffd078 90%, #95532a 100%);
        box-shadow: inset 0 1px rgba(255, 221, 143, 0.48), inset 0 -1px rgba(72, 37, 22, 0.55);
        transform: rotateZ(var(--a)) translateX(var(--r)) rotateY(90deg); }
      @keyframes ld-spin { from { transform: rotateX(-7deg) rotateY(0deg); } to { transform: rotateX(-7deg) rotateY(360deg); } }
      .ld-cover.is-calm .ld-coin { animation: none; transform: rotateX(-7deg) rotateY(-18deg); }
      @media (prefers-reduced-motion: reduce) { .ld-coin { animation: none; transform: rotateX(-7deg) rotateY(-18deg); } }
      .ld-progress { width: 23vh; display: flex; flex-direction: column; gap: 1.3vh; }
      .ld-bar { width: 100%; height: max(3px, 0.37vh); border-radius: 2px; background: rgba(247, 236, 210, 0.22); overflow: hidden; }
      .ld-bar-fill { height: 100%; width: 0%; background: var(--ld-orange); }
      .ld-line { color: var(--ld-cream); font: 500 max(14px, 2vh) 'Barlow', system-ui, sans-serif; letter-spacing: 0.02em; white-space: nowrap;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
      .ld-cover[data-mode="cover"] .ld-bar { display: none; }
      /* A picture's fact card (art/loading/cards.json): above the coin, over a deeper shade; hidden for pictures without one. */
      .ld-cover.has-card .ld-shade { background:
        radial-gradient(ellipse 58vw 82vh at 0% 78%, rgba(4, 16, 22, 0.82), rgba(4, 16, 22, 0.5) 50%, rgba(4, 16, 22, 0) 100%),
        linear-gradient(0deg, rgba(4, 16, 22, 0.45), rgba(4, 16, 22, 0) 40%); }
      .ld-card { position: absolute; left: 3.3vw; bottom: 24vh; width: 38vw; color: var(--ld-cream); opacity: 0; transition: opacity 300ms ease-out; }
      .ld-cover:not(.has-card) .ld-card { display: none; }
      .ld-cover.is-ready .ld-card { opacity: 1; }
      .ld-kicker { font: 600 1.75vh/1 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: #ffa14f;
        display: flex; align-items: center; gap: 1.2vh; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.5); }
      .ld-kicker::before { content: ''; width: 4.4vh; height: 0.37vh; background: var(--ld-orange); border-radius: 2px; }
      .ld-name { margin: 1.4vh 0 0; font: 400 9.4vh/1 'Knewave', system-ui, sans-serif; color: var(--ld-cream);
        text-shadow: 0.4vh 0.4vh 0 #1d6b74, 0 0.2vh 1.7vh rgba(0, 0, 0, 0.35); -webkit-text-stroke: 0.14vh #ef7d2e; }
      .ld-sub { margin: 0.9vh 0 0; font: 400 3.5vh/1.1 'Caveat Brush', cursive; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
      .ld-latin { opacity: 0.8; }
      .ld-fact { margin: 2.2vh 0 0; max-width: 34vw; font: 500 2.45vh/1.42 'Barlow Semi Condensed', 'Barlow', system-ui, sans-serif;
        color: rgba(247, 236, 210, 0.94); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7); }
      .ld-noongar { margin-top: 1.6vh; padding-left: 1.6vh; border-left: 0.37vh solid var(--ld-teal); }
      .ld-noongar:empty { display: none; }
      .ld-noongar b { font-weight: 600; letter-spacing: 0.04em; color: #8fd3d0; }
      .ld-cover[data-mode="cover"] .ld-line { animation: ld-pulse 1.6s ease-in-out infinite alternate; }
      .ld-cover.is-calm .ld-line { animation: none; }
      @keyframes ld-pulse { from { opacity: 1; } to { opacity: 0.55; } }
    </style>

    <!-- The pictures' fact cards: written by tools/loadingArt.py from art/loading/cards.json (don't edit here). -->
    <script type="application/json" id="ld-cards">{"birds-albatross":{"kicker":"Birds · Cape to Cape","name":"Shy albatross","common":"","latin":"Thalassarche cauta","fact":"Australia’s own albatross: it breeds on only three islands off Tasmania, with wings up to 2.5 metres across. In winter, albatrosses glide past Cape Leeuwin and Cape Naturaliste."},"birds-brown-honeyeater":{"kicker":"Birds · Cape to Cape","name":"Brown honeyeater","common":"","latin":"Lichmera indistincta","fact":"Only about 10 grams, but it has one of the loudest, sweetest songs of any Australian honeyeater.","noongar":"names for it include djindjoko and kyeet."},"birds-carnabys":{"kicker":"Birds · Cape to Cape","name":"Carnaby’s cockatoo","common":"White-tailed black cockatoo","latin":"Zanda latirostris","fact":"Endangered, and found only in WA’s south-west. Flocks crack open banksia, hakea and marri for the seeds. Pairs mate for life, and one bird lived to 35.","noongar":"people call it ngolyenok."},"birds-fairywren":{"kicker":"Birds · Cape to Cape","name":"Splendid fairywren","common":"Blue wren","latin":"Malurus splendens","fact":"The male turns electric blue for the breeding season, and courts females with pink and purple petals he plucks himself. In autumn the blue fades away.","noongar":"names for it include djorrdjilya and djodjal."},"birds-hooded-plover":{"kicker":"Birds · Cape to Cape","name":"Hooded plover","common":"","latin":"Thinornis cucullatus","fact":"Lays its eggs in a bare scrape in the sand above the tide line, on surf beaches like Gallows, South Point and Left Handers. Only about 14 pairs breed on the Capes, so give them room."},"birds-kestrel":{"kicker":"Birds · Cape to Cape","name":"Nankeen kestrel","common":"Australian kestrel","latin":"Falco cenchroides","fact":"A small falcon that hangs in the wind on one spot, then drops onto grasshoppers, beetles and lizards. Nankeen is a yellowish cotton cloth, first made in Nanjing, China.","noongar":"names for it include martiet."},"birds-kookaburra":{"kicker":"Introduced bird · Cape to Cape","name":"Laughing kookaburra","common":"","latin":"Dacelo novaeguineae","fact":"Not from here: it was brought over from the eastern states from 1883, hundreds of birds in all, probably for its name as a snake-killer. Family groups laugh together to mark their patch."},"birds-osprey":{"kicker":"Birds · Cape to Cape","name":"Osprey","common":"Eastern osprey","latin":"Pandion haliaetus cristatus","fact":"A fish hawk that plunges feet-first into the sea. Ospreys nest on rock stacks along this coast and keep adding to the same nest year after year, until it can stand 2 metres tall.","noongar":"names for it include yoondoordo, and around Busselton it was recorded as koomagert."},"birds-oystercatcher":{"kicker":"Birds · Cape to Cape","name":"Sooty oystercatcher","common":"","latin":"Haematopus fuliginosus","fact":"All black, with a red bill, eyes and legs. It works the rock platforms at low tide, and nests on lonely headlands like Gnarabup and Redgate. Females eat crabs, while males go for mussels and urchins.","noongar":"names for it include kwikan. Around the Vasse it was recorded as kwee-kern."},"birds-ringneck":{"kicker":"Birds · Cape to Cape","name":"Twenty-eight","common":"Australian ringneck","latin":"Barnardius zonarius semitorquatus","fact":"Named for its call, which sounds like “twenty-eight”. One early French listener heard “vingt-huit”.","noongar":"names for it include dowarn, recorded around the Vasse, and doomolok."},"birds-sea-eagle":{"kicker":"Birds · Cape to Cape","name":"White-bellied sea eagle","common":"","latin":"Icthyophaga leucogaster","fact":"A big female can spread her wings 2.2 metres. Pairs stay together for life, and some nests are used for decades.","noongar":"names for it include djilyon and ngoolar."},"birds-spinebill":{"kicker":"Birds · Cape to Cape","name":"Western spinebill","common":"","latin":"Acanthorhynchus superciliosus","fact":"Found only in the south-west. Its long, curved bill reaches the nectar deep inside tube flowers, like kangaroo paw, that other honeyeaters can’t get to.","noongar":"people call it booldjit."},"birds-tropicbird":{"kicker":"Birds · Cape to Cape","name":"Red-tailed tropicbird","common":"","latin":"Phaethon rubricauda","fact":"It dives for flying fish and squid far out at sea. Tropicbirds once nested on Sugarloaf Rock, off Cape Naturaliste, but they stopped around 2008. Now a pair or two nest on Rottnest instead."},"birds-wattlebird":{"kicker":"Birds · Cape to Cape","name":"Red wattlebird","common":"","latin":"Anthochaera carunculata","fact":"Australia’s second-biggest honeyeater, named for the pinkish-red wattles on its cheeks. It guards a flowering tree noisily against all comers.","noongar":"names for it include wodjalok. Around the Vasse it was recorded as dangong."},"flora-balga":{"kicker":"Local flora · Cape to Cape","name":"Balga","common":"Grass tree","latin":"Xanthorrhoea preissii","fact":"Grows only a centimetre or so a year, so a tall one can be centuries old. Its blackened trunk shrugs off bushfire, and a fire makes it flower all the more.","noongar":"people named it balga. Its gum, spears for fishing and fire drills all came from it, and the bardi grubs living inside were good tucker."},"flora-coast-daisy-bush":{"kicker":"Local flora · Cape to Cape","name":"Daisy-bush","common":"Coast daisy-bush","latin":"Olearia axillaris","fact":"A silvery, scented shrub that thrives in the salt wind. The Dutch explorer Willem de Vlamingh is said to have cooked with its leaves on Rottnest in 1696."},"flora-coast-sword-sedge":{"kicker":"Local flora · Cape to Cape","name":"Sword-sedge","common":"Coast sword-sedge","latin":"Lepidosperma gladiatum","fact":"Big clumps of flat, sharp-pointed leaves, as long as swords, with spiky brown flower heads standing on tall stalks through summer and autumn.","noongar":"people call it kerbein, and ate the tender part of its stem all year round."},"flora-cockies-tongues":{"kicker":"Local flora · Cape to Cape","name":"Cockies’ tongues","common":"","latin":"Templetonia retusa","fact":"Its bright red pea flowers light up the limestone cliffs in winter.","noongar":"people call the flower inji, and Injidup, one of the coast’s best-known surf breaks, takes its name from it."},"flora-fan-flower":{"kicker":"Local flora · Cape to Cape","name":"Fan-flower","common":"Thick-leaved fan-flower","latin":"Scaevola crassifolia","fact":"Every flower looks cut in half, its petals all fanned out to one side. Scaevola means “left-handed” in Latin, and crassifolia “thick-leaved”."},"flora-parrot-bush":{"kicker":"Local flora · Cape to Cape","name":"Parrot bush","common":"","latin":"Banksia sessilis","fact":"It pours out nectar for honeyeaters, and black cockatoos and ringneck parrots feast on its seed. Fire kills it, but it drops so much seed that it bounces straight back.","noongar":"names for it include budjan and butyak."},"flora-peppermint":{"kicker":"Local flora · Cape to Cape","name":"Peppermint","common":"WA peppermint","latin":"Agonis flexuosa","fact":"The critically endangered western ringtail possum depends on it, feeding at night on its young leaves, flowers and fruit.","noongar":"people call it wonnil (spellings vary). Its leaves were used as an antiseptic, and young trunks became spear shafts."},"flora-pigface":{"kicker":"Local flora · Cape to Cape","name":"Pigface","common":"","latin":"Carpobrotus virescens","fact":"A fleshy succulent that sprawls metres across the dunes and cliffs, with big purple-pink flowers around a white centre.","noongar":"people ate its fruit in late December, and used its juice to soothe burns, scalds and stings."},"flora-prickly-conostylis":{"kicker":"Local flora · Cape to Cape","name":"Conostylis","common":"Prickly conostylis","latin":"Conostylis aculeata","fact":"Aculeata means “with prickles”: its strappy leaves are edged with spines. In spring, bright yellow, furry tube flowers cluster on tall stalks."},"flora-rice-flower":{"kicker":"Local flora · Cape to Cape","name":"Rice flower","common":"Pink rice flower","latin":"Pimelea ferruginea","fact":"Round heads of tiny tube flowers top every branch, usually pink, sometimes white. Gardeners grow it around the world. Ferruginea means “rust-coloured”."},"flora-sea-spurge":{"kicker":"Coastal weed · Cape to Cape","name":"Sea spurge","common":"","latin":"Euphorbia paralias","fact":"An invader from southern Europe and North Africa, first recorded in WA at Albany in 1927. Its seeds float along the coast, and its bitter sap stings skin and eyes."},"flora-spyridium":{"kicker":"Local flora · Cape to Cape","name":"Basket bush","common":"","latin":"Spyridium globulosum","fact":"Its name is Greek for “little basket”: each head of tiny cream flowers sits in a cup of white, furry leaves. Common on the dunes along this coast."},"reptiles-bearded-dragon":{"kicker":"Reptiles · Cape to Cape","name":"Western bearded dragon","common":"","latin":"Pogona minor","fact":"Waves a front leg to signal a rival or a mate, and the males bob their heads. Look for one basking on a fence post or a log."},"reptiles-bobtail":{"kicker":"Reptiles · Cape to Cape","name":"Bobtail","common":"Shingleback","latin":"Tiliqua rugosa","fact":"Often found sunbaking right on the Cape to Cape Track. Its stumpy tail stores fat for the cold months, and a pair can meet up again every spring for 20 years.","noongar":"people call it yoorn."},"reptiles-carpet-python":{"kicker":"Reptiles · Cape to Cape","name":"Carpet python","common":"South-western carpet python","latin":"Morelia imbricata","fact":"Not venomous, and mostly out at night, so lucky walkers rarely see one. A mother coils around her eggs and shivers her muscles to keep them warm until they hatch.","noongar":"names for it include wakal."},"reptiles-crowned-snake":{"kicker":"Reptiles · Cape to Cape","name":"Crowned snake","common":"Western crowned snake","latin":"Elapognathus coronatus","fact":"A small snake of the south-west’s coastal heath, about 40 cm long, with a dark band across its neck like a crown. It hunts skinks and frogs. Mildly venomous: look, don’t touch."},"reptiles-dugite":{"kicker":"Reptiles · Cape to Cape","name":"Dugite","common":"","latin":"Pseudonaja affinis","fact":"Found only in the south-west, in shades from grey to green to brown. Shy: leave it alone and it leaves you alone. If you meet one, stop, stay still and back away slowly.","noongar":"gave English its name: dugite comes from the Noongar word, recorded as dukitj and toogitj."},"reptiles-marbled-gecko":{"kicker":"Reptiles · Cape to Cape","name":"Marbled gecko","common":"","latin":"Christinus marmoratus","fact":"Australia’s most southerly gecko. It drops its tail to get away from a predator, then spends about eight months growing a new one."},"reptiles-tiger-snake":{"kicker":"Reptiles · Cape to Cape","name":"Tiger snake","common":"","latin":"Notechis scutatus","fact":"Shy, and keeps clear of noisy people, but it will strike if cornered. On warm days snakes bask on the Cape to Cape Track: give them room, and they’ll slip away."},"sea-fauna-abalone":{"kicker":"Sea life · Cape to Cape","name":"Roe’s abalone","common":"","latin":"Haliotis roei","fact":"Lives on the shallow limestone reefs right where the waves break, grazing on seaweed at night. Perth’s abalone season lasts just a few hours a year, and thousands crowd the reef for it."},"sea-fauna-bronze-whaler":{"kicker":"Sea life · Cape to Cape","name":"Bronze whaler","common":"Copper shark","latin":"Carcharhinus brachyurus","fact":"A slow-growing shark: it takes about 16 years to grow up, and a female can live past 30. It eats fish and squid, and even jellyfish."},"sea-fauna-cuttlefish":{"kicker":"Sea life · Cape to Cape","name":"Giant cuttlefish","common":"Giant Australian cuttlefish","latin":"Ascarosepion apama","fact":"Changes colour in an instant, and raises its skin into bumps and frills to copy rock, sand or weed. It grows to about a metre long, yet lives only two to four years."},"sea-fauna-dolphins":{"kicker":"Sea life · Cape to Cape","name":"Bottlenose dolphins","common":"","latin":"Tursiops","fact":"Families of dolphins play in the surf along the Capes, riding the same waves as the crew.","noongar":"people call dolphins kwilena, and fished together with them."},"sea-fauna-fur-seal":{"kicker":"Sea life · Cape to Cape","name":"Long-nosed fur seal","common":"","latin":"Arctocephalus forsteri","fact":"Sealers wiped them out on the islands off Cape Leeuwin in the 1850s. In 1982, about 130 years later, they came back. They dive deeper than any other fur seal, past 300 metres.","noongar":"people call the seal manyil."},"sea-fauna-herring":{"kicker":"Sea life · Cape to Cape","name":"Australian herring","common":"Tommy ruff","latin":"Arripis georgianus","fact":"Not a true herring. Its eggs and larvae drift south and east along the south coast, and the grown fish swim back west to spawn. A classic catch off the rocks and beaches."},"sea-fauna-humpback":{"kicker":"Sea life · Cape to Cape","name":"Humpback whale","common":"","latin":"Megaptera novaeangliae","fact":"They pass the Capes heading north to the Kimberley from June to August, and come back south from September to November. Mothers with tiny calves rest in Geographe Bay before the long swim to Antarctica.","noongar":"names for whales include mamang."},"sea-fauna-leafy-seadragon":{"kicker":"Sea life · Cape to Cape","name":"Leafy seadragon","common":"","latin":"Phycodurus eques","fact":"Most of WA’s sightings are along this coast, from Busselton to Augusta. Its leafy flaps make it look like drifting weed. The female lays her eggs under the male’s tail, and he carries them until they hatch."},"sea-fauna-port-jackson":{"kicker":"Sea life · Cape to Cape","name":"Port Jackson shark","common":"","latin":"Heterodontus portusjacksoni","fact":"A gentle reef shark that crunches sea urchins and shellfish with flat back teeth. It lays spiral, corkscrew-shaped egg cases that wedge into cracks in the reef."},"sea-fauna-rock-lobster":{"kicker":"Sea life · Cape to Cape","name":"Western rock lobster","common":"","latin":"Panulirus cygnus","fact":"Its larvae drift 9 to 11 months far out in the Indian Ocean before swimming back to the reef. On the Capes, no lobster pots are allowed in the surfing zones."},"sea-fauna-salmon":{"kicker":"Sea life · Cape to Cape","name":"Australian salmon","common":"Western Australian salmon","latin":"Arripis truttaceus","fact":"Not a true salmon. They grow up in South Australia and Tasmania, then swim west to gather between Cape Leeuwin and Busselton in late autumn and early winter to spawn.","noongar":"people call the salmon ngari. Their yearly run matters so much to the Wadandi people that Ngari Capes Marine Park is named after it."},"sea-fauna-southern-right":{"kicker":"Sea life · Cape to Cape","name":"Southern right whale","common":"","latin":"Eubalaena australis","fact":"Mothers bring their calves into the sheltered water of Flinders Bay at Augusta each winter. No dorsal fin, a V-shaped blow, and pale crusty patches on the head that tell one whale from another."},"sea-fauna-stingray":{"kicker":"Sea life · Cape to Cape","name":"Smooth stingray","common":"Short-tail stingray","latin":"Bathytoshia brevicaudata","fact":"One of the biggest stingrays in the world: more than 2 metres across and up to 350 kilograms. At Hamelin Bay they glide right into the shallows.","noongar":"names for stingrays include bamba."},"sea-fauna-tiger-shark":{"kicker":"Sea life · Cape to Cape","name":"Tiger shark","common":"","latin":"Galeocerdo cuvier","fact":"A tropical shark that visits cooler southern water now and then. Its stripes are boldest when it’s young, and often fade once it grows past about 3 metres."},"sea-fauna-white-shark":{"kicker":"Sea life · Cape to Cape","name":"White shark","common":"White pointer","latin":"Carcharodon carcharias","fact":"Warm-bodied: it can keep itself up to 14 °C warmer than the sea around it. At Margaret River’s Main Break, a receiver on the seabed hears tagged sharks and sends alerts to the SharkSmart WA app."},"sea-flora-asparagopsis":{"kicker":"Sea flora · Cape to Cape","name":"Harpoon weed","common":"Asparagopsis","latin":"Asparagopsis armata","fact":"Barbed branches hook it onto other seaweeds. First described from Garden Island, WA, it holds a chemical that cuts the methane cattle burp when a pinch is added to their feed."},"sea-flora-coralline":{"kicker":"Sea flora · Cape to Cape","name":"Coralline algae","common":"Branching coralline","latin":"Corallinales","fact":"A seaweed that builds stone into its walls. The branching kinds bend at soft joints, like a string of beads. One kind grows on seagrass, and was collected at Canal Rocks near Yallingup."},"sea-flora-kelp":{"kicker":"Sea flora · Cape to Cape","name":"Golden kelp","common":"","latin":"Ecklonia radiata","fact":"The backbone of the Great Southern Reef, kelp forest that runs 8,000 km from Kalbarri round to Brisbane. Along the Capes, some kelp clones itself, its fronds growing new holdfasts that grip the reef."},"sea-flora-laurencia":{"kicker":"Sea flora · Cape to Cape","name":"Laurencia","common":"","latin":"Laurencia","fact":"A red seaweed armed with bitter chemicals that put grazers off, though sea hares eat it anyway. In Hawaii one kind is used as a peppery seasoning."},"sea-flora-paddle-weed":{"kicker":"Sea flora · Cape to Cape","name":"Paddle weed","common":"Dugong grass","latin":"Halophila ovalis","fact":"A tiny seagrass with oval leaves: a flowering plant, with separate male and female plants. Up north it’s a favourite food of dugongs, which is why it’s also called dugong grass."},"sea-flora-posidonia":{"kicker":"Sea flora · Cape to Cape","name":"Seagrass","common":"Strapweed","latin":"Posidonia","fact":"Not a seaweed but a flowering plant. Outside Shark Bay, Geographe Bay holds WA’s biggest seagrass meadows: nurseries for fish that also lock away carbon."},"sea-flora-sargassum":{"kicker":"Sea flora · Cape to Cape","name":"Sargassum","common":"","latin":"Sargassum","fact":"It floats on tiny gas-filled bladders, which reminded Portuguese sailors of grapes (sargaço). Lots of it washed up on the beach means a rough, swell-hit coast offshore."},"sea-flora-sea-lettuce":{"kicker":"Sea flora · Cape to Cape","name":"Sea lettuce","common":"","latin":"Ulva","fact":"A bright green seaweed that thrives where the water is rich in nutrients, so it piles up near river mouths more than on the clean ocean coast. It’s edible, too."},"sea-flora-sirophysalis":{"kicker":"Sea flora · Cape to Cape","name":"Three-node seaweed","common":"","latin":"Sirophysalis trinodis","fact":"Probably the first seaweed Europeans collected in Australia: William Dampier picked it up off the WA coast in 1699, and his specimen is still kept at Oxford."},"sea-flora-strapweed":{"kicker":"Sea flora · Cape to Cape","name":"Western crayweed","common":"","latin":"Scytothalia dorycarpa","fact":"One of the big habitat-making seaweeds of WA’s temperate coast, up to 2 metres long, on rough-water reefs like this one. The 2011 marine heatwave pushed its range back about 100 km."}}</script>
    <script>
      // Inline so the cover paints before the game's code loads: show the start-up picture (data-boot, one of the
      // copies tools/loadingArt.py makes), build the coin's rim, and show the art only once picture and emblem are
      // decoded, so nothing half-drawn shows (it fades in over 300 ms).
      (function () {
        var cover = document.getElementById('ld-cover');
        var names = (cover.dataset.slides || '').split(/\s+/).filter(Boolean);
        // The start-up picture is always the crew surfing (Andrew 2026-10-08); the slides are for the later covers.
        // ?slide=<name> shows that slide instead (to review its card).
        var asked = new URLSearchParams(location.search).get('slide');
        var name = names.indexOf(asked) >= 0 ? asked : cover.dataset.boot || names[0];
        var img = cover.querySelector('.ld-cover-bg img');
        img.srcset = '/loading/' + name + '-1920.webp 1920w, /loading/' + name + '-full.webp 3840w';
        img.src = '/loading/' + name + '-1920.webp';
        cover.dataset.slide = name;
        // The picture's fact card, if it has one (window.ldFillCard: loadingScreen.ts fills later covers the same way).
        var cards = {};
        try { cards = JSON.parse(document.getElementById('ld-cards').textContent || '{}'); } catch (e) {}
        window.ldFillCard = function (el, card) {
          el.classList.toggle('has-card', !!card);
          if (!card) return;
          var q = function (c) { return el.querySelector(c); };
          q('.ld-kicker').textContent = card.kicker;
          q('.ld-name').textContent = card.name;
          q('.ld-common').textContent = card.common ? card.common + ' · ' : '';
          q('.ld-latin').textContent = card.latin;
          q('.ld-fact').textContent = card.fact;
          var n = q('.ld-noongar');
          n.textContent = '';
          if (card.noongar) { var b = document.createElement('b'); b.textContent = 'Noongar '; n.append(b, card.noongar); }
        };
        window.ldFillCard(cover, cards[name] || null);
        var rim = cover.querySelector('.ld-rim');
        for (var i = 0; i < 96; i++) {
          var panel = document.createElement('span');
          panel.style.setProperty('--a', ((i + 0.5) * 3.75) + 'deg');
          rim.appendChild(panel);
        }
        var emblem = new Image();
        emblem.src = '/loading/emblem.webp';
        // A card waits for its fonts too, so it never shows in a stand-in font first.
        var fonts = cards[name] ? ['400 10px Knewave', '400 10px "Caveat Brush"', '500 10px "Barlow Semi Condensed"', '600 10px "Barlow Semi Condensed"']
          .map(function (f) { return document.fonts.load(f); }) : [];
        Promise.all([img.decode(), emblem.decode()].concat(fonts).map(function (p) { return p.catch(function () {}); }))
          .then(function () { cover.classList.add('is-ready'); });
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
