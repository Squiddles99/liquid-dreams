<!doctype html>
<html lang="en" data-ld-loading="boot">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Dreams</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" as="image" href="/loading/emblem.webp" />
    <style>
      /* The loading cover (loading screens spec §1.1): inline so it paints before the game's code loads. */
      :root { --ld-sand: #e8dbc4; --ld-teal: #3f959b; --ld-orange: #f7931e; --ld-cream: #f7ecd2; --ld-ink: #0a1a1f; }
      html, body { background: var(--ld-sand); }
      .ld-cover { position: fixed; inset: 0; z-index: 2147483000; background: var(--ld-ink); overflow: hidden; pointer-events: none;
        opacity: 1; transition: opacity 400ms ease-out; }
      .ld-cover:not(.is-in) { opacity: 0; }
      .ld-cover.is-out { opacity: 0; transition: opacity 1200ms cubic-bezier(0.33, 1, 0.68, 1); }
      .ld-cover.is-out.is-calm { transition-duration: 300ms; }
      .ld-cover[hidden] { display: none; }
      /* While it blocks the player, the mouse stops here too: no click, wheel or hover reaches the menu under it. */
      .ld-cover.is-blocking { pointer-events: auto; cursor: progress; }
      .ld-cover-bg { position: absolute; inset: 0; opacity: 0; transition: opacity 300ms ease-out; }
      .ld-cover-bg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block; }
      /* A dark pool in the bottom-left corner, so the coin and the line read over bright water. */
      .ld-shade { position: absolute; inset: 0; background: radial-gradient(ellipse 47vw 48vh at 0% 100%, rgba(4, 16, 22, 0.72), rgba(4, 16, 22, 0) 70%); }
      .ld-brand { position: absolute; left: 3.3vw; bottom: 5.2vh; display: flex; align-items: center; gap: 2vh; opacity: 0; transition: opacity 300ms ease-out; }
      .ld-cover.is-ready .ld-cover-bg, .ld-cover.is-ready .ld-brand { opacity: 1; }
      /* The coin (Andrew's spinning-logo-loader): two emblem faces on a copper rim of 96 panels, turning every 8 s.
         Pure CSS transform animation, so the compositor keeps it turning while the main thread builds shaders. */
      .ld-coin-scene { --coin: 15.5vh; --thick: calc(var(--coin) * 0.14); --r: calc(var(--coin) * 0.48);
        width: var(--coin); height: var(--coin); flex: none; perspective: 900px; filter: drop-shadow(0 1vh 1.7vh rgba(0, 0, 0, 0.45)); }
      .ld-coin { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: ld-spin 8s linear infinite; will-change: transform; }
      .ld-face, .ld-rim { position: absolute; inset: 0; transform-style: preserve-3d; }
      .ld-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: url(/loading/emblem.webp) center / contain no-repeat; }
      .ld-face-front { transform: translateZ(calc(var(--thick) / 2 + 0.2px)); }
      .ld-face-back { transform: rotateY(180deg) translateZ(calc(var(--thick) / 2 + 0.2px)); }
      .ld-rim span { position: absolute; left: 50%; top: 50%; width: var(--thick); height: calc(var(--coin) * 0.032725 + 0.8px);
        margin-left: calc(var(--thick) / -2); margin-top: calc((var(--coin) * 0.032725 + 0.8px) / -2);
        background: linear-gradient(90deg, #6b3b25 0%, #e49b3e 5%, #ffd078 10%, #a65e2b 18%, #784326 43%, #8b4c27 57%, #bb702e 82%, #ffd078 90%, #95532a 100%);
        box-shadow: inset 0 1px rgba(255, 221, 143, 0.48), inset 0 -1px rgba(72, 37, 22, 0.55);
        transform: rotateZ(var(--a)) translateX(var(--r)) rotateY(90deg); }
      @keyframes ld-spin { from { transform: rotateX(-7deg) rotateY(0deg); } to { transform: rotateX(-7deg) rotateY(360deg); } }
      .ld-cover.is-calm .ld-coin { animation: none; transform: rotateX(-7deg) rotateY(-18deg); }
      @media (prefers-reduced-motion: reduce) { .ld-coin { animation: none; transform: rotateX(-7deg) rotateY(-18deg); } }
      .ld-progress { width: 23vh; display: flex; flex-direction: column; gap: 1.3vh; }
      .ld-bar { width: 100%; height: max(3px, 0.37vh); border-radius: 2px; background: rgba(247, 236, 210, 0.22); overflow: hidden; }
      .ld-bar-fill { height: 100%; width: 0%; background: var(--ld-orange); }
      .ld-line { color: var(--ld-cream); font: 500 max(14px, 2vh) 'Barlow', system-ui, sans-serif; letter-spacing: 0.02em; white-space: nowrap;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); }
      .ld-cover[data-mode="cover"] .ld-bar { display: none; }
      .ld-cover[data-mode="cover"] .ld-line { animation: ld-pulse 1.6s ease-in-out infinite alternate; }
      .ld-cover.is-calm .ld-line { animation: none; }
      @keyframes ld-pulse { from { opacity: 1; } to { opacity: 0.55; } }
    </style>
  </head>
  <body>
    <div id="ld-cover" class="ld-cover is-in is-blocking" data-mode="boot" data-slides="crew-wave" aria-label="Loading Liquid Dreams" role="status">
      <div class="ld-cover-bg"><img alt="" sizes="100vw" /></div>
      <div class="ld-shade"></div>
      <div class="ld-brand">
        <div class="ld-coin-scene" aria-hidden="true">
          <div class="ld-coin"><div class="ld-rim"></div><div class="ld-face ld-face-front"></div><div class="ld-face ld-face-back"></div></div>
        </div>
        <div class="ld-progress">
          <div class="ld-bar"><div class="ld-bar-fill"></div></div>
          <div class="ld-line">Waking the GPU…</div>
        </div>
      </div>
    </div>
    <script>
      // Inline so the cover paints before the game's code loads: pick the start-up picture from data-slides (the
      // copies tools/loadingArt.py makes), build the coin's rim, and show the art only once picture and emblem are
      // decoded, so nothing half-drawn shows (it fades in over 300 ms).
      (function () {
        var cover = document.getElementById('ld-cover');
        var names = (cover.dataset.slides || '').split(/\s+/).filter(Boolean);
        var name = names[Math.floor(Math.random() * names.length)];
        var img = cover.querySelector('.ld-cover-bg img');
        img.srcset = '/loading/' + name + '-1920.webp 1920w, /loading/' + name + '-full.webp 3840w';
        img.src = '/loading/' + name + '-1920.webp';
        cover.dataset.slide = name;
        var rim = cover.querySelector('.ld-rim');
        for (var i = 0; i < 96; i++) {
          var panel = document.createElement('span');
          panel.style.setProperty('--a', ((i + 0.5) * 3.75) + 'deg');
          rim.appendChild(panel);
        }
        var emblem = new Image();
        emblem.src = '/loading/emblem.webp';
        Promise.all([img.decode(), emblem.decode()].map(function (p) { return p.catch(function () {}); }))
          .then(function () { cover.classList.add('is-ready'); });
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
